name: SŪRA Rescue CI/CD Pipeline

on:
  push:
    branches: [rescue] # Adapted to run exactly when you push your rescue branch
  pull_request:
    branches: [rescue]
  workflow_dispatch:

# Single execution per branch: a new push automatically cancels old pending runs
concurrency:
  group: ci-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Upgraded to 'write' so the runner can create GitHub Releases

jobs:
  verify:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recherche de clés secrètes (Rodium)
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=build --exclude-dir=.dart_tool -E "rd_sk_[A-Za-z0-9]{8,}" . ; then
            echo "::error::Une clé Rodium semble présente dans le dépôt : la supprimer et la révoquer."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Générer le code Drift
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyse statique (échoue seulement sur les erreurs)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests unitaires
        run: flutter test --reporter expanded

  build-apk:
    name: Compilation et Déploiement APK
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      
      - name: Générer le code Drift
        run: dart run build_runner build --delete-conflicting-outputs

      # 1. Compile the Debug (Development) APK
      - name: Build Debug APK
        run: flutter build apk --debug --target-platform android-arm64

      # 2. Upload the Debug APK as an Action Artifact (Kept for 14 days)
      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sura-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # 3. Compile the production-ready Release APKs (Optimized split for devices)
      - name: Build Production Release APKs
        run: flutter build apk --release --split-per-abi

      # 4. Automatically publish the Production APKs directly to GitHub Releases
      - name: Publish Production APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          tag_name: v1.0.0-rescue-\${{ github.run_number }}
          name: SŪRA Rescue Release v1.0.0 (Build #\${{ github.run_number }})
          body: |
            ### 🏥 SŪRA Rescue Automated Deployment
            This production build was compiled and verified automatically from the `rescue` branch configuration.
            
            **Pipeline Verification Checks:**
            * 🛡️ **Security Scan:** No exposed Rodium credentials detected in code baseline.
            * 🔄 **Database Engine:** Drift structural generation artifacts matched successfully (`build_runner`).
            * 🧪 **Code Quality:** Automated lint analysis diagnostics passed with zero compilation errors.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}

